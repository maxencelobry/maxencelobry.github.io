<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>push_swap visualizer</title>
<style>
:root {
	--bg: #0b0d0c; --line: #26302a; --fg: #c9d4cb;
	--muted: #6f7d73; --accent: #ffb000; --green: #5fdb7a; --err: #ff6b5e;
	color-scheme: dark;
}
* { box-sizing: border-box; }
body {
	margin: 0; padding: 20px 16px; background: var(--bg); color: var(--fg);
	font: 13px/1.5 ui-monospace, "JetBrains Mono", "DejaVu Sans Mono", Menlo, Consolas, monospace;
}
main { max-width: 1200px; margin: 0 auto; display: grid; gap: 14px; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
h1 { font-size: 13px; font-weight: 400; margin: 0 auto 0 0; color: var(--green); }
h1::before { content: "$ "; color: var(--muted); }
h1::after { content: "_"; animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { h1::after { animation: none; } }
.tabs { display: flex; gap: 4px; }
button, input, textarea { font: inherit; color: var(--fg); background: none; border: 0; border-radius: 0; }
button { cursor: pointer; padding: 2px 0; color: var(--muted); }
button::before { content: "["; margin-right: 1px; }
button::after { content: "]"; margin-left: 1px; }
button:hover:not(:disabled), button:focus-visible { color: var(--fg); outline: none; }
button:disabled { opacity: .35; cursor: default; }
button.primary, .tabs button[aria-pressed="true"] { color: var(--green); }
button.primary { min-width: 7ch; text-align: left; }
.card { border-top: 1px solid var(--line); padding: 12px 0 0; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; }
textarea, input[type=number] { border-bottom: 1px solid var(--line); padding: 2px 4px; }
textarea:focus, input[type=number]:focus { outline: none; border-color: var(--green); }
textarea { flex: 1 1 320px; min-height: 26px; height: 26px; resize: vertical; }
input[type=number] { width: 6ch; }
input[type=range] { accent-color: var(--green); height: 12px; }
#seek { flex: 1 1 200px; }
label { color: var(--muted); display: flex; align-items: center; gap: 6px; }
#err { color: var(--err); min-height: 1.5em; margin-top: 4px; }
.stats { display: flex; flex-wrap: wrap; gap: 2px 20px; color: var(--muted); font-variant-numeric: tabular-nums; }
.stats b { color: var(--fg); font-weight: 400; }
#note { margin-top: 8px; min-height: 3em; }
#note::before { content: "> "; color: var(--muted); }
#log { margin-top: 6px; white-space: nowrap; overflow: hidden; color: var(--muted); min-height: 1.6em; }
#log span { display: inline-block; margin-right: 1ch; }
#log .done { opacity: .5; }
#log .next { color: var(--bg); background: var(--accent); padding: 0 .5ch; }
.stacks { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.stacks h2 { font-size: 13px; margin: 0 0 8px; color: var(--muted); font-weight: 400; }
canvas { display: block; width: 100%; height: 560px; }
.help { color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; }
@media (max-width: 600px) { canvas { height: 380px; } }
</style>
</head>
<body>
<main>
	<header>
		<h1>push_swap --visualize</h1>
		<div class="tabs" id="tabs">
			<button data-mode="simple" aria-pressed="true">simple</button>
			<button data-mode="medium" aria-pressed="false">medium</button>
			<button data-mode="complex" aria-pressed="false">complex</button>
		</div>
	</header>

	<section class="card">
		<div class="row">
			<textarea id="input" spellcheck="false" aria-label="Numbers to sort">8 3 -2 15 7 0 12 4 9 -5 1 6 14 -8 10 2</textarea>
			<button id="load">load</button>
			<label>n <input id="randn" type="number" min="2" max="1000" value="16"></label>
			<button id="rand">random</button>
		</div>
		<div id="err" role="alert"></div>
	</section>

	<section class="card">
		<div class="row">
			<button id="reset" title="Reset (Home)">reset</button>
			<button id="back" title="Step backward (←)">&lt; step</button>
			<button id="play" class="primary" title="Play / pause (Space)">play</button>
			<button id="fwd" title="Step forward (→)">step &gt;</button>
			<button id="end" title="Jump to end (End)">end</button>
			<input id="seek" type="range" min="0" max="0" value="0" aria-label="Position">
			<label>speed <input id="speed" type="range" min="0" max="100" value="35"> <span id="speedv"></span></label>
		</div>
		<div class="stats" style="margin-top:10px" id="stats"></div>
		<div id="note"></div>
		<div id="log"></div>
	</section>

	<section class="stacks">
		<div class="card"><h2 id="ha">stack a</h2><canvas id="ca"></canvas></div>
		<div class="card"><h2 id="hb">stack b</h2><canvas id="cb"></canvas></div>
	</section>

	<div class="help">
		Top of each stack is at the top. Bar length = rank of the value. Keys: Space play/pause, ← → step, Home reset, End jump to end.
	</div>
</main>

<script>
//<core>
// Faithful port of solve_simple.c / solve_medium.c / solve_complex.c.
// Stacks hold ranks (0..n-1); index 0 is the top, as in the C arrays.
const OPS = {
	sa: s => swap(s.a), sb: s => swap(s.b), ss: s => { swap(s.a); swap(s.b); },
	pa: s => push(s.b, s.a), pb: s => push(s.a, s.b),
	ra: s => rot(s.a), rb: s => rot(s.b), rr: s => { rot(s.a); rot(s.b); },
	rra: s => rrot(s.a), rrb: s => rrot(s.b), rrr: s => { rrot(s.a); rrot(s.b); },
};
const INV = { sa: 'sa', sb: 'sb', ss: 'ss', pa: 'pb', pb: 'pa', ra: 'rra', rb: 'rrb',
	rr: 'rrr', rra: 'ra', rrb: 'rb', rrr: 'rr' };
function swap(x) { if (x.length >= 2) { const t = x[0]; x[0] = x[1]; x[1] = t; } }
function push(from, to) { if (from.length) to.unshift(from.shift()); }
function rot(x) { if (x.length >= 2) x.push(x.shift()); }
function rrot(x) { if (x.length >= 2) x.unshift(x.pop()); }

function toRanks(values) {
	const sorted = [...values].sort((x, y) => x - y);
	const rank = new Map(sorted.map((v, i) => [v, i]));
	return { ranks: values.map(v => rank.get(v)), sorted };
}
function isSolved(s) {
	if (s.b.length) return false;
	for (let i = 1; i < s.a.length; i++) if (s.a[i - 1] > s.a[i]) return false;
	return true;
}
function closerToTop(stack, v) {
	const i = stack.indexOf(v);
	return i >= 0 && i <= Math.floor(stack.length / 2);
}

// Returns { ops: string[], ctx: object[] }. ctx[i] explains why op i happens.
function solve(mode, ranks, val) {
	const s = { a: [...ranks], b: [] };
	const cap = ranks.length;
	const ops = [], ctx = [];
	let cur = null;
	const op = name => { OPS[name](s); ops.push(name); ctx.push(cur); };
	if (isSolved(s)) return { ops, ctx };

	if (mode === 'simple') {
		while (s.a.length > 1) {
			let mi = 0;
			for (let i = 1; i < s.a.length; i++) if (s.a[i] < s.a[mi]) mi = i;
			const min = s.a[mi], size = s.a.length;
			if (closerToTop(s.a, min)) {
				cur = { hl: { k: 'one', r: min }, note: `Smallest value left in A is ${val(min)}, at index ${mi} of ${size}. ` +
					`Top half: bring it up with ${mi} × ra, then pb.` };
				for (let r = mi; r > 0; r--) op('ra');
			} else {
				cur = { hl: { k: 'one', r: min }, note: `Smallest value left in A is ${val(min)}, at index ${mi} of ${size}. ` +
					`Bottom half: bring it up with ${size - mi} × rra, then pb.` };
				for (let r = size - mi; r > 0; r--) op('rra');
			}
			op('pb');
		}
		cur = { hl: null, note: 'A holds only the largest value. B is sorted in descending order: pa everything back.' };
		while (s.b.length) op('pa');
	} else if (mode === 'medium') {
		let chunks = 1;
		while (chunks * chunks < cap) chunks++;
		for (let i = 1; i <= chunks; i++) {
			const lo = chunks * (i - 1), hi = Math.min(chunks * i, cap);
			cur = { hl: { k: 'band', lo, hi }, note: `Phase 1, chunk ${i}/${chunks}: push ranks ${lo}..${hi - 1} to B. ` +
				`ra skips anything of rank ≥ ${chunks * i}, pb takes the rest.` };
			let n = chunks;
			while (s.a.length && n--) {
				while (s.a[0] >= chunks * i) op('ra');
				op('pb');
			}
		}
		while (s.b.length) {
			const target = s.a.length ? s.a[0] - 1 : cap - 1;
			let j = s.b.indexOf(target);
			const size = s.b.length;
			if (closerToTop(s.b, target)) {
				cur = { hl: { k: 'one', r: target }, note: `Phase 2: next value needed on A is ${val(target)} (rank ${target}), ` +
					`at index ${j} of ${size} in B. Top half: ${j} × rb, then pa.` };
				while (j--) op('rb');
			} else {
				cur = { hl: { k: 'one', r: target }, note: `Phase 2: next value needed on A is ${val(target)} (rank ${target}), ` +
					`at index ${j} of ${size} in B. Bottom half: ${size - j} × rrb, then pa.` };
				j = size - j;
				while (j--) op('rrb');
			}
			op('pa');
		}
	} else {
		let bit = 0;
		while (!isSolved(s)) {
			cur = { hl: { k: 'bit', b: bit }, note: `Radix pass on bit ${bit} of the rank: ` +
				`bit = 1 stays in A (ra), bit = 0 goes to B (pb).` };
			let n = s.a.length;
			while (s.a.length && n--) {
				if (s.a[0] >> bit & 1) op('ra');
				else op('pb');
			}
			cur = { hl: { k: 'bit', b: bit }, note: `Bit ${bit} done: pa everything back. ` +
				`The bit-0 values now sit above the bit-1 values, order preserved.` };
			while (s.b.length) op('pa');
			bit++;
		}
	}
	return { ops, ctx };
}

function parseNumbers(text) {
	const tokens = text.split(/[\s,]+/).filter(t => t.length);
	if (!tokens.length) return { error: 'Enter at least one number.' };
	const values = [], seen = new Set();
	for (const t of tokens) {
		if (!/^[+-]?\d+$/.test(t)) return { error: `Error: "${t}" is not an integer.` };
		const v = Number(t);
		if (v > 2147483647 || v < -2147483648) return { error: `Error: ${t} does not fit in an int.` };
		if (seen.has(v)) return { error: `Error: duplicate value ${v}.` };
		seen.add(v);
		values.push(v);
	}
	return { values };
}
function disorder(values) {
	let mistakes = 0, pairs = 0;
	for (let i = 0; i < values.length; i++)
		for (let j = i + 1; j < values.length; j++) { pairs++; if (values[i] > values[j]) mistakes++; }
	return pairs ? mistakes / pairs : 0;
}
//</core>

const $ = id => document.getElementById(id);
const MODE_INFO = {
	simple: 'solve_simple — selection sort, O(n²)',
	medium: 'solve_medium — √n chunks, O(n√n)',
	complex: 'solve_complex — binary radix sort, O(n log n)',
};
let mode = 'simple';
let values = [], sorted = [], ranks = [];
let ops = [], ctx = [];
let st = { a: [], b: [] };
let pos = 0;
let playing = false, lastT = 0, acc = 0;

function load() {
	const r = parseNumbers($('input').value);
	$('err').textContent = r.error || '';
	if (r.error) return;
	values = r.values;
	({ ranks, sorted } = toRanks(values));
	rebuild();
}
function rebuild() {
	stop();
	({ ops, ctx } = solve(mode, ranks, r => sorted[r]));
	st = { a: [...ranks], b: [] };
	pos = 0;
	$('seek').max = ops.length;
	render();
}
function seek(target) {
	target = Math.max(0, Math.min(ops.length, target));
	while (pos < target) OPS[ops[pos++]](st);
	while (pos > target) OPS[INV[ops[--pos]]](st);
	render();
}
function opsPerSec() { return Math.round(Math.pow(10, $('speed').value / 100 * 3.5)); }
function stop() { playing = false; $('play').textContent = 'play'; }
function toggle() {
	if (playing) return stop();
	if (!ops.length) return;
	if (pos >= ops.length) seek(0);
	playing = true; lastT = 0; acc = 0;
	$('play').textContent = 'pause';
	requestAnimationFrame(tick);
}
function tick(t) {
	if (!playing) return;
	if (lastT) acc += (t - lastT) / 1000 * opsPerSec();
	lastT = t;
	const n = Math.floor(acc);
	if (n > 0) { acc -= n; seek(pos + n); }
	if (pos >= ops.length) return stop();
	requestAnimationFrame(tick);
}

function render() {
	const n = values.length, c = pos < ops.length ? ctx[pos] : null;
	$('seek').value = pos;
	$('back').disabled = $('reset').disabled = pos === 0;
	$('fwd').disabled = $('end').disabled = pos >= ops.length;
	$('play').disabled = !ops.length;
	$('speedv').textContent = opsPerSec() + ' ops/s';

	const counts = {};
	for (const o of ops) counts[o] = (counts[o] || 0) + 1;
	const breakdown = Object.entries(counts).map(([k, v]) => `${k} ${v}`).join(' · ');
	let extra = '';
	if (mode === 'medium') extra = `<span>chunks <b>${Math.ceil(Math.sqrt(n))}</b></span>`;
	if (mode === 'complex') extra = `<span>bits <b>${Math.max(1, Math.ceil(Math.log2(n)))}</b></span>`;
	$('stats').innerHTML = `<span><b>${MODE_INFO[mode]}</b></span><span>n <b>${n}</b></span>` +
		`<span>disorder <b>${disorder(values).toFixed(2)}</b></span>${extra}` +
		`<span>op <b>${pos}</b> / <b>${ops.length}</b></span><span>${breakdown}</span>`;

	if (!ops.length) $('note').textContent = 'Input is already sorted: 0 operations.';
	else if (!c) $('note').textContent = `Sorted in ${ops.length} operations.`;
	else $('note').textContent = c.note;

	const from = Math.max(0, pos - 10), to = Math.min(ops.length, pos + 14);
	let html = from > 0 ? '… ' : '';
	for (let i = from; i < to; i++)
		html += `<span class="${i < pos ? 'done' : i === pos ? 'next' : ''}">${ops[i]}</span>`;
	$('log').innerHTML = html + (to < ops.length ? ' …' : '');

	$('ha').textContent = `stack a [${st.a.length}]`;
	$('hb').textContent = `stack b [${st.b.length}]`;
	draw($('ca'), st.a, c && c.hl, true);
	draw($('cb'), st.b, c && c.hl, false);
}

function draw(canvas, stack, hl, isA) {
	const css = getComputedStyle(document.documentElement);
	const fg = css.getPropertyValue('--fg').trim(), accent = css.getPropertyValue('--accent').trim();
	const dpr = window.devicePixelRatio || 1;
	const W = canvas.clientWidth, H = canvas.clientHeight;
	if (canvas.width !== Math.round(W * dpr) || canvas.height !== Math.round(H * dpr)) {
		canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
	}
	const g = canvas.getContext('2d');
	g.setTransform(dpr, 0, 0, dpr, 0, 0);
	g.clearRect(0, 0, W, H);
	const n = values.length;
	if (!n) return;
	const rowH = Math.min(22, H / n);
	const gap = rowH >= 6 ? 2 : 0;
	const labels = rowH >= 14;
	const bits = Math.max(1, Math.ceil(Math.log2(n)));
	const showBits = labels && mode === 'complex';
	g.font = `${Math.min(13, rowH - 3)}px ui-monospace, monospace`;
	g.textBaseline = 'middle';
	const chW = g.measureText('0').width;
	const widest = Math.max(...sorted.map(v => String(v).length));
	const labelW = labels ? (widest + (showBits ? bits + 2 : 0) + 2) * chW : 0;
	const barMax = W - labelW;

	for (let i = 0; i < stack.length; i++) {
		const r = stack[i], y = i * rowH;
		const w = Math.max(2, barMax * (r + 1) / n);
		let dim = false;
		if (hl && isA && hl.k === 'band') dim = r < hl.lo || r >= hl.hi;
		if (hl && isA && hl.k === 'bit') dim = !(r >> hl.b & 1);
		g.globalAlpha = dim ? 0.3 : 1;
		g.fillStyle = `hsl(135 55% ${22 + 46 * (n > 1 ? r / (n - 1) : 0)}%)`;
		g.fillRect(0, y, w, Math.max(1, rowH - gap));
		g.globalAlpha = 1;
		const marked = hl && hl.k === 'one' && hl.r === r;
		if (marked) {
			g.strokeStyle = accent; g.lineWidth = 2;
			g.strokeRect(1, y + 1, Math.max(2, w - 2), Math.max(2, rowH - gap - 2));
			if (!labels) { g.fillStyle = accent; g.fillRect(w + 4, y - 1, 12, Math.max(3, rowH)); }
		}
		if (labels) {
			const cy = y + (rowH - gap) / 2;
			let x = w + chW;
			g.fillStyle = marked ? accent : fg;
			g.fillText(String(sorted[r]), x, cy);
			if (showBits) {
				x += (widest + 2) * chW;
				const bin = r.toString(2).padStart(bits, '0');
				for (let k = 0; k < bits; k++) {
					const active = hl && hl.k === 'bit' && bits - 1 - k === hl.b;
					g.fillStyle = active ? accent : fg;
					g.globalAlpha = active ? 1 : 0.45;
					g.fillText(bin[k], x + k * chW, cy);
				}
				g.globalAlpha = 1;
			}
		}
	}
}

$('tabs').addEventListener('click', e => {
	const b = e.target.closest('button');
	if (!b) return;
	mode = b.dataset.mode;
	for (const t of $('tabs').children) t.setAttribute('aria-pressed', t === b);
	rebuild();
});
$('load').onclick = load;
$('rand').onclick = () => {
	const n = Math.max(2, Math.min(1000, parseInt($('randn').value, 10) || 20));
	const v = Array.from({ length: n }, (_, i) => i + 1);
	for (let i = n - 1; i > 0; i--) {
		const j = Math.floor(Math.random() * (i + 1));
		[v[i], v[j]] = [v[j], v[i]];
	}
	$('input').value = v.join(' ');
	load();
};
$('play').onclick = toggle;
$('reset').onclick = () => { stop(); seek(0); };
$('end').onclick = () => { stop(); seek(ops.length); };
$('back').onclick = () => { stop(); seek(pos - 1); };
$('fwd').onclick = () => { stop(); seek(pos + 1); };
$('seek').oninput = e => { stop(); seek(+e.target.value); };
$('speed').oninput = render;
$('input').addEventListener('keydown', e => {
	if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); load(); }
});
document.addEventListener('keydown', e => {
	if (e.target.matches('textarea, input[type=number]')) return;
	const k = e.key;
	if (k === ' ') toggle();
	else if (k === 'ArrowRight') { stop(); seek(pos + 1); }
	else if (k === 'ArrowLeft') { stop(); seek(pos - 1); }
	else if (k === 'Home') { stop(); seek(0); }
	else if (k === 'End') { stop(); seek(ops.length); }
	else return;
	e.preventDefault();
});
window.addEventListener('resize', render);
load();
</script>
</body>
</html>
